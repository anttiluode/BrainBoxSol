name: One-time cleanup of merged experiment branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-experiments.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact merged tips and delete them atomically
        shell: bash
        run: |
          set -euo pipefail
          leases=()
          deletions=()
          while read -r branch expected; do
            actual=$(git rev-parse "refs/remotes/origin/$branch")
            if [[ "$actual" != "$expected" ]]; then
              echo "Refusing cleanup: branch changed: $branch"
              exit 1
            fi
            git merge-base --is-ancestor "$expected" HEAD
            leases+=("--force-with-lease=refs/heads/$branch:$expected")
            deletions+=(":refs/heads/$branch")
          done <<'BRANCHES'
          sol/local-material-credit-g0 973bb638b002e434019150cb90352922cd0c2ba9
          sol/phase-bridge-synthesis ceb95f72a0536337fe8c53d1330ca7c2a8e70d45
          sol/outer-response-lens-g3 852eed3079b3c101c3056c35969e19a13b7dc3b0
          sol/adaptive-medium-design db084340bb3c21d738a9f18fa3116d476ed0babd
          sol/reward-feedback d8e3e0a9edfa94d7d3445a68ec37cd637a64db71
          sol/history-waveform 416061f8c8359cbdbc661d88308a89f965e43436
          BRANCHES
          git push --atomic "${leases[@]}" origin "${deletions[@]}"
