name: BrainBoxSol CPU gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest -v test_brainboxsol
      - run: OPENBLAS_NUM_THREADS=1 python brainboxsol.py --out results/gate0.json
      - run: OPENBLAS_NUM_THREADS=1 python sweep.py --out results/sweep.json
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest -v test_phase_bridge_gate
      - run: OPENBLAS_NUM_THREADS=1 python phase_bridge_gate.py --out results/phase_bridge.json
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest -v test_outer_lens
      - run: OPENBLAS_NUM_THREADS=1 python outer_lens.py --out results/outer_lens.json
      - run: OPENBLAS_NUM_THREADS=1 python sweep_outer_lens.py --out results/outer_lens_sweep.json
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest -v test_adaptive_medium test_adaptive_medium_gate
      - run: OPENBLAS_NUM_THREADS=1 python adaptive_medium_gate.py --mode smoke --out results/adaptive_medium/ci-smoke.json
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest -v test_reward_medium test_reward_gate
      - run: OPENBLAS_NUM_THREADS=1 python reward_gate.py --mode smoke --out results/reward_medium/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: brainboxsol-receipts
          path: |
            results/*.json
            results/adaptive_medium/*.json
            results/adaptive_medium/*.html
            results/reward_medium/*.json
